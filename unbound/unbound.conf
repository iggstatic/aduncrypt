server:

    # The  verbosity  number, level:
    #   - 0 no verbosity, only errors,
    #   - 1 logs operational information,
    #   - 2 logs detailed operational  information,
    #   - 3 logs query level information,
    #   - 4 logs algorithm  level  information,
    #   - 5 logs client identification for cache misses.
    # Default is level 1.
    verbosity: 0

    interface: 127.0.0.1
    port: 5053
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # Unbound local queries need to be off if using stubby or dnscrypt
    do-not-query-localhost: no

    # May be set to yes if you have IPv6 connectivity
    do-ip6: no

    # You want to leave this set to no unless you have *native* IPv6. With 6to4 and
    # Teredo tunnels, your web browser should favor IPv4 for the same reasons
    prefer-ip6: no

    # Path to the certificate bundle for TLS validation (only needed if a
    # DNS-over-TLS forwarder is enabled below)
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

    # Trust glue only if it is within the servers authority
    harden-glue: yes

    # Ignore very large queries.
    harden-large-queries: yes

    # Require DNSSEC data for trust-anchored zones, if such data is absent, the zone becomes BOGUS
    # If you want to disable DNSSEC, set harden-dnssec-stripped: no
    harden-dnssec-stripped: yes

    # Enable DNSSEC validation. The root trust anchor is bootstrapped by the
    # entrypoint and kept up to date by Unbound itself (RFC 5011).
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # Return Extended DNS Errors (RFC 8914) so clients can see why a query
    # failed, e.g. a DNSSEC validation failure
    ede: yes

    # Harden against unknown records in the authority/additional sections
    harden-unknown-additional: yes

    # Can be uncommented if you do not need file access protection
    #chroot: ""

    # Number of bytes size to advertise as the EDNS reassembly buffer
    # size. This is the value put into  datagrams over UDP towards
    # peers. The actual buffer size is determined by msg-buffer-size
    # (both for TCP and UDP).
    edns-buffer-size: 1232

    # Rotates RRSet order in response (the pseudo-random
    # number is taken from Ensure privacy of local IP
    # ranges the query ID, for speed and thread safety).
    # private-address: 192.168.0.0/16
    rrset-roundrobin: yes

    # Time to live minimum for RRsets and messages in the cache. If the minimum
    # kicks in, the data is cached for longer than the domain owner intended,
    # and thus less queries are made to look up the data. Zero makes sure the
    # data in the cache is as the domain owner intended, higher values,
    # especially more than an hour or so, can lead to trouble as the data in
    # the cache does not match up with the actual data anymore
    cache-min-ttl: 0
    cache-max-ttl: 86400

    # Serve stale data (RFC 8767): try to resolve first and only fall back to
    # an expired cache entry if the upstream has not answered within the
    # client timeout. Expired entries are kept for at most serve-expired-ttl.
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800

    # Harden against algorithm downgrade when multiple algorithms are
    # advertised in the DS record.
    harden-algo-downgrade: yes

    # Ignore very small EDNS buffer sizes from queries.
    harden-short-bufsize: yes

    # Refuse id.server and hostname.bind queries
    hide-identity: yes

    # Report this identity rather than the hostname of the server.
    identity: "Server"

    # Refuse version.server and version.bind queries
    hide-version: yes

    # Let the unbound server to background as a daemon
    do-daemonize: no

    # Number  of  bytes size of the aggressive negative cache.
    neg-cache-size: 4m

    # Send minimum amount of information to upstream servers to enhance privacy
    qname-minimisation: yes

    # Deny queries of type ANY with an empty response.
    # Works only on version 1.8 and above
    deny-any: yes

    # Do not insert authority/additional sections into response messages when
    # those sections are not required. This reduces response size
    # significantly, and may avoid TCP fallback for some responses. This may
    # cause a slight speedup.
    minimal-responses: yes

    # Perform prefetching of close to expired message cache entries
    # This only applies to domains that have been frequently queried
    prefetch: yes

    # Fetch the DNSKEYs earlier in the validation process, when a DS record is
    # encountered. This lowers the latency of requests at the expense of little
    # more CPU usage.
    prefetch-key: yes

    # One thread should be sufficient, can be increased on beefy machines. In reality for
    # most users running on small networks or on a single machine, it should be unnecessary
    # to seek performance enhancement by increasing num-threads above 1.
    num-threads: 1

    # More cache memory, rrset-cache-size should twice what msg-cache-size is.
    msg-cache-size: 50m
    rrset-cache-size: 100m

    # Faster UDP with multithreading (only on Linux).
    so-reuseport: yes

    # Use the system default socket buffers. Unbound runs unprivileged inside
    # the container and cannot raise them above the kernel limit anyway.
    so-rcvbuf: 0
    so-sndbuf: 0

    # Set the total number of unwanted replies to keep track of in every thread.
    # When it reaches the threshold, a defensive action of clearing the rrset
    # and message caches is taken, hopefully flushing away any poison.
    # Unbound suggests a value of 10 million.
    unwanted-reply-threshold: 100000

    # Do not print one line per query to the log
    log-queries: no
    # Do not print one line per reply to the log
    log-replies: no
    # Do not print log lines that say why queries return SERVFAIL to clients
    log-servfail: no
    # Do not print log lines to inform about local zone actions
    log-local-actions: no
    # Log to stderr so errors show up in the container logs. Setting a
    # logfile implicitly turns off use-syslog, which does not exist here.
    logfile: ""

    # Ensure privacy of local IP ranges
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10

forward-zone:
  name: "."

  # Forward everything to dnscrypt-proxy, which encrypts queries with ODoH.
  # dnscrypt-proxy listens on plain DNS, so TLS must stay off here.
  forward-tls-upstream: no
  forward-addr: 127.0.0.1@5353

  # Alternatively, forward directly to a public DNS-over-TLS resolver instead
  # of dnscrypt-proxy. TLS applies to every forward-addr in this zone, so
  # comment out the dnscrypt-proxy address and set forward-tls-upstream: yes.

  # Quad9(Standard)
  #forward-addr: 9.9.9.9@853#dns.quad9.net
  #forward-addr: 149.112.112.112@853#dns.quad9.net

  # Quad9(ECS support)
  #forward-addr: 9.9.9.11@853#dns11.quad9.net
  #forward-addr: 149.112.112.11@853#dns11.quad9.net

  # OpenDNS
  #forward-addr: 208.67.222.222@853#doh.opendns.com
  #forward-addr: 208.67.220.220@853#doh.opendns.com

  # Cloudflare
  #forward-addr: 1.1.1.1@853#cloudflare-dns.com
  #forward-addr: 1.0.0.1@853#cloudflare-dns.com

  # Google
  #forward-addr: 8.8.8.8@853#dns.google
  #forward-addr: 8.8.4.4@853#dns.google

  # AdGuard
  #forward-addr: 94.140.14.14@853#dns.adguard.com
  #forward-addr: 94.140.15.15@853#dns.adguard.com
