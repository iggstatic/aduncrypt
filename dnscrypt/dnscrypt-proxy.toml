# More info about dnscrypt-proxy configuration settings:
# go to: https://github.com/DNSCrypt/dnscrypt-proxy/blob/master/dnscrypt-proxy/example-dnscrypt-proxy.toml

# List of local addresses and ports to listen to. Can be IPv4 and/or IPv6.
# Example:
#   - listen to both IPv4 and IPv6: listen_addresses = ['127.0.0.1:53', '[::1]:53']
#   - listen to all IPv4 addresses: listen_addresses = ['0.0.0.0:53']
#   - listen to all IPv4+IPv6 addresses: use `listen_addresses = ['[::]:53']`
listen_addresses = ['127.0.0.1:5353']

# The entrypoint already starts dnscrypt-proxy as the dnscrypt user, so there
# are no privileges to drop here
# user_name = 'dnscrypt'

# Use servers reachable over IPv6
ipv6_servers = false
block_ipv6 = false

# Enable a DNS cache to reduce latency and outgoing traffic (set to false if using Unbound)
cache = false

# Use servers implementing the specific protocol
dnscrypt_servers = false
odoh_servers = true
doh_servers = false

# ODoH (Oblivious DoH) targets, both no-log with DNSSEC. Cloudflare is the
# primary; crypto.sx (anycast, Scaleway) is a second target so resolution keeps
# working if one is down. dnscrypt-proxy load-balances between them by measured
# latency and drops any that stop responding.
# For other ODoH servers, go to: https://github.com/DNSCrypt/dnscrypt-resolvers/blob/master/v3/odoh-servers.md
server_names = ['odoh-cloudflare', 'odoh-crypto-sx']

# Resolvers used only to fetch the server lists and check connectivity at
# startup. Never rely on the container's /etc/resolv.conf, which may point
# back at AdGuard Home itself.
ignore_system_dns = true
bootstrap_resolvers = ['9.9.9.11:53', '8.8.8.8:53']
netprobe_address = '9.9.9.9:53'

# ODoH queries are encrypted for the target and sent through a relay, so the
# target never sees the client IP and the relay never sees the query. A relay
# and a target run by the same operator must not be paired, or that operator
# sees both, which is why odoh-crypto-sx is only routed through the Numa relay.
# Relays: https://github.com/DNSCrypt/dnscrypt-resolvers/blob/master/v3/odoh-relays.md
[anonymized_dns]
routes = [
    { server_name='odoh-cloudflare', via=['odohrelay-crypto-sx', 'odohrelay-numa'] },
    { server_name='odoh-crypto-sx', via=['odohrelay-numa'] }
]

# ODoH (Oblivious DoH) servers and relays. The downloaded lists are cached
# under /var/cache/dnscrypt-proxy, which compose.yml and the Quadlet file
# keep in a named volume so a restart does not depend on reaching GitHub.
[sources]
  [sources.'odoh-servers']
  urls = ['https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/odoh-servers.md', 'https://download.dnscrypt.info/resolvers-list/v3/odoh-servers.md', 'https://cdn.jsdelivr.net/gh/DNSCrypt/dnscrypt-resolvers@master/v3/odoh-servers.md']
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  cache_file = '/var/cache/dnscrypt-proxy/odoh-servers.md'
  refresh_delay = 73
  prefix = ''

  [sources.'odoh-relays']
  urls = ['https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/odoh-relays.md', 'https://download.dnscrypt.info/resolvers-list/v3/odoh-relays.md', 'https://cdn.jsdelivr.net/gh/DNSCrypt/dnscrypt-resolvers@master/v3/odoh-relays.md']
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  cache_file = '/var/cache/dnscrypt-proxy/odoh-relays.md'
  refresh_delay = 73
  prefix = ''
