name: Build and Publish to GHCR

on:
  push:
    branches: [master]
    paths-ignore:
      - "LICENSE"
      - "README.md"
      - "*.md"
      - ".gitignore"
      - ".github/workflows/update-version.yml" # Don't trigger on workflow updates
  pull_request:
    branches: [master]
    paths-ignore:
      - "LICENSE"
      - "README.md"
      - "*.md"
      - ".gitignore"
      - ".github/workflows/update-version.yml"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build for"
        required: false
        default: "linux/amd64,linux/arm64,linux/arm/v7"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract AGH version from Containerfile
        id: extract-version
        run: |
          VERSION=$(grep -oP '(?<=AGH_VER=)\S+' Containerfile)
          echo "Extracted AGH version: $VERSION"
          echo "AGH_VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.extract-version.outputs.AGH_VERSION }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
          labels: |
            org.opencontainers.image.title=AdUnCrypt
            org.opencontainers.image.description=Privacy-focused DNS stack with AdGuard Home, Unbound, and DNSCrypt-proxy
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.licenses=MIT

      - name: Build for testing
        id: build-test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          load: true
          tags: test-image:latest
          cache-from: |
            type=gha,scope=master
            type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: test-image:latest
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true

      - name: Functionality test
        timeout-minutes: 10
        env:
          AGH_USER: admin
          AGH_PASS: ci-only-password
        run: |
          set -euo pipefail
          # Same restrictions as compose.yml: no root services, minimal capabilities
          docker run -d --name aduncrypt-test --platform linux/amd64 \
            --cap-drop ALL \
            --cap-add NET_BIND_SERVICE --cap-add CHOWN --cap-add FOWNER \
            --cap-add SETUID --cap-add SETGID --cap-add KILL --cap-add DAC_OVERRIDE \
            --security-opt no-new-privileges:true \
            -p 127.0.0.1:3000:3000 -p 127.0.0.1:8080:80 \
            test-image:latest

          echo "⏳ Waiting for the container to report healthy..."
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' aduncrypt-test)
            [ "$status" = healthy ] && break
            if [ "$status" = unhealthy ] || [ "$i" -eq 30 ]; then
              echo "❌ Container is $status"; docker logs aduncrypt-test; exit 1
            fi
            sleep 2
          done
          echo "✅ Container healthy"

          echo "🔍 Checking that no service runs as root..."
          docker exec aduncrypt-test ps -o user,comm | tee /dev/stderr \
            | awk '$2 ~ /^(dnscrypt-proxy|unbound|AdGuardHome)$/ { seen[$2]=$1 }
                   END { n=0; for (s in seen) { n++; if (seen[s]=="root") { print "❌ " s " runs as root"; exit 1 } }
                         if (n!=3) { print "❌ expected 3 services, found " n; exit 1 } }'
          echo "✅ All services run unprivileged"

          echo "🧙 Completing the AdGuard Home setup wizard through its API..."
          curl -sSf -X POST http://127.0.0.1:3000/control/install/configure \
            -H 'Content-Type: application/json' \
            -d "{\"web\":{\"ip\":\"0.0.0.0\",\"port\":80},\"dns\":{\"ip\":\"0.0.0.0\",\"port\":53},\"username\":\"$AGH_USER\",\"password\":\"$AGH_PASS\"}"
          for i in $(seq 1 15); do
            curl -sf -o /dev/null -u "$AGH_USER:$AGH_PASS" http://127.0.0.1:8080/control/status && break
            [ "$i" -eq 15 ] && { echo "❌ Web UI not up on port 80"; docker logs aduncrypt-test; exit 1; }
            sleep 2
          done

          echo "⚙️ Applying the upstream settings from the README..."
          curl -sSf -u "$AGH_USER:$AGH_PASS" -X POST http://127.0.0.1:8080/control/dns_config \
            -H 'Content-Type: application/json' \
            -d '{"upstream_dns":["127.0.0.1:5053"],"fallback_dns":["127.0.0.1:5353"],"bootstrap_dns":[],"upstream_mode":"load_balance","cache_size":0,"dnssec_enabled":true}'
          sleep 2

          echo "🌐 Testing DNS resolution chain through AdGuard Home (port 53)..."
          drill_in() { docker exec aduncrypt-test drill "$@"; }
          for port in 53 5053 5353; do
            addr=$(drill_in -p "$port" google.com @127.0.0.1 A | awk '/^google\.com\./ && $4=="A" {print $5; exit}')
            [ -n "$addr" ] || { echo "❌ No answer on port $port"; docker logs aduncrypt-test; exit 1; }
            echo "✅ Port $port responding → $addr"
          done

          echo "🔒 Testing DNSSEC validation end to end..."
          if drill_in -D cloudflare.com @127.0.0.1 A | grep -E '^;; flags:' | grep -qw ad; then
            echo "✅ AD flag set for a signed zone"
          else
            echo "❌ No AD flag through AdGuard Home"; exit 1
          fi
          if drill_in dnssec-failed.org @127.0.0.1 A | grep -q SERVFAIL; then
            echo "✅ Badly signed zone rejected"
          else
            echo "❌ Badly signed zone was not rejected"; exit 1
          fi

          echo "🩺 Running the container healthcheck against the configured stack..."
          docker exec aduncrypt-test sh /opt/scripts/healthcheck.sh
          echo "✅ Healthcheck passed"

          docker stop aduncrypt-test
          echo "🎉 All tests passed! DNS privacy stack is working correctly."

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64,linux/arm/v7' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=master
            type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Upload security scan results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Verify published image
        if: github.event_name != 'pull_request'
        run: |
          echo "🚀 Image published successfully!"
          echo "📦 Tags: ${{ steps.meta.outputs.tags }}"
          echo "🏷️ AGH Version: ${{ steps.extract-version.outputs.AGH_VERSION }}"
          echo "🔗 Registry: https://github.com/${{ github.repository_owner }}/pkgs/container/${{ github.event.repository.name }}"

      - name: Clean up old container versions
        if: github.event_name != 'pull_request'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: "aduncrypt"
          package-type: "container"
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
