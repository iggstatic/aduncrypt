services:
  aduncrypt:
    image: ghcr.io/iggstatic/aduncrypt:latest
    container_name: aduncrypt
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # inherited by AdGuard Home for ports 53 and 80
      - CHOWN # ownership of the service directories
      - FOWNER # permissions of the AdGuard Home directories
      - SETUID # switching to the service users
      - SETGID
      - KILL # supervising the service processes
      - DAC_OVERRIDE # reading bind-mounted config files regardless of owner
      #- NET_RAW # inherited by AdGuard Home when present, for its DHCP server
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "sh", "/opt/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
    volumes:
      - "./adguard/opt-adguard-work:/opt/adguardhome/work"
      - "./adguard/opt-adguard-conf:/opt/adguardhome/conf"
      - "./unbound/unbound.conf:/opt/unbound/unbound.conf"
      - "./dnscrypt:/opt/dnscrypt"
      # DNSSEC root trust anchor and cached dnscrypt-proxy resolver lists
      - "aduncrypt-unbound:/var/lib/unbound"
      - "aduncrypt-dnscrypt-cache:/var/cache/dnscrypt-proxy"
    ports:
      - 53:53/tcp # DNS
      - 53:53/udp # DNS
      - 80:80/tcp # AdGuard Home HTTP
      - 3000:3000/tcp # AdGuard Home setup wizard, not needed after setup
      #- 443:443/tcp # AdGuard Home HTTPS
      #- 443:443/udp # AdGuard Home HTTPS
      #- 853:853/tcp # AdGuard Home DNS-over-TLS/QUIC
      #- 67:67/udp # AdGuard Home DHCP (server)
      #- 68:68/udp # AdGuard Home DHCP (client)

volumes:
  aduncrypt-unbound:
  aduncrypt-dnscrypt-cache:
