services:
  aduncrypt:
    image: ghcr.io/iggstatic/aduncrypt:latest
    container_name: aduncrypt
    restart: unless-stopped
    # Every service runs as its own unprivileged user. Drop every capability
    # and add back only what the entrypoint needs before it hands off to them.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # passed on to AdGuard Home for ports 53 and 80
      - CHOWN # entrypoint chowns the service directories
      - FOWNER # entrypoint chmods the AdGuard Home directories
      - SETUID # entrypoint switches to the service users
      - SETGID
      - KILL # entrypoint watches and signals the service processes
      - DAC_OVERRIDE # read bind-mounted config files regardless of owner
      #- NET_RAW # passed on to AdGuard Home only if present, needed for its DHCP server
    security_opt:
      - no-new-privileges:true
    volumes:
      - "./adguard/opt-adguard-work:/opt/adguardhome/work"
      - "./adguard/opt-adguard-conf:/opt/adguardhome/conf"
      - "./unbound/unbound.conf:/opt/unbound/unbound.conf"
      - "./dnscrypt:/opt/dnscrypt"
      # DNSSEC root trust anchor and cached dnscrypt-proxy resolver lists
      - "aduncrypt-unbound:/var/lib/unbound"
      - "aduncrypt-dnscrypt-cache:/var/cache/dnscrypt-proxy"
    ports:
      - 53:53/tcp # DNS
      - 53:53/udp # DNS
      - 80:80/tcp # AdGuard Home HTTP
      - 3000:3000/tcp # AdGuard Home install wizard (remove after setup)
      #- 443:443/tcp # AdGuard Home HTTPS
      #- 443:443/udp # AdGuard Home HTTPS
      #- 853:853/tcp # AdGuard Home DNS-over-TLS/QUIC
      #- 67:67/udp # AdGuard Home DHCP (server)
      #- 68:68/udp # AdGuard Home DHCP (client)

volumes:
  aduncrypt-unbound:
  aduncrypt-dnscrypt-cache:
